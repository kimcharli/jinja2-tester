<!DOCTYPE html>
<html>
<head>
    <title>Jinja2 Template Validator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.1">
</head>
<body>
    <div class="main-container">
        <h1>Jinja2 Template Validator</h1>
        
        <div class="split-layout">
            <!-- Left Panel - Inputs -->
            <div class="left-panel">
                <div class="input-section">
                    <h3>Template Input</h3>
                    <div class="input-controls">
                        <select id="templateSelect" class="format-select" style="margin-right: auto; max-width: 250px;">
                            <option value="">-- Choose Configlet --</option>
                        </select>
                        <button id="downloadTemplateBtn" class="secondary-button">Download</button>
                        <button id="uploadTemplateBtn" class="secondary-button">Upload</button>
                        <input type="file" id="templateFile" accept=".j2,.jinja,.jinja2,.html,.txt" style="display: none;">
                    </div>
                    <textarea id="templateInput" name="template" placeholder="Enter your Jinja2 template here...">{{ template_input }}</textarea>
                </div>
                
                <div class="whitespace-controls">
                    <h4>Whitespace Control</h4>
                    <div class="control-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="trimBlocksToggle" checked>
                            <span class="checkbox-text">Trim Blocks (remove newlines after tags)</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="lstripBlocksToggle" checked>
                            <span class="checkbox-text">Strip Blocks (remove leading whitespace)</span>
                        </label>
                    </div>
                </div>
                
                <div class="input-section">
                    <h3>Data Input</h3>
                    <div class="input-controls">
                        <select id="dataFormatSelect" class="format-select">
                            <option value="json">JSON</option>
                            <option value="yaml">YAML</option>
                            <option value="apstra">Device Context (Apstra)</option>
                        </select>
                        <button id="formatDataBtn" class="secondary-button">Format</button>
                        <button id="downloadDataBtn" class="secondary-button">Download</button>
                        <button id="uploadDataBtn" class="secondary-button">Upload</button>
                        <input type="file" id="dataFile" accept=".json,.yaml,.yml" style="display: none;">
                    </div>
                    <textarea id="dataInput" name="data" placeholder="Enter data in JSON or YAML format...">{{ data_input if data_input else '{}' }}</textarea>
                </div>
                
                <div class="validate-row">
                    <button id="validateBtn" class="primary-button">Validate and Render</button>
                    <button id="statusBtn" class="status-button" title="Show status details">Status</button>
                </div>

                <!-- Always include result div -->
                <div id="resultDiv" class="result" style="display: none;"></div>

                <!-- Status panel (hidden by default) -->
                <div id="statusPanel" class="status-panel" style="display: none;">
                    <div class="status-header">
                        <strong>Status Details</strong>
                        <button id="statusCloseBtn" class="status-close">&times;</button>
                    </div>
                    <div id="statusContent" class="status-content">
                        <div class="status-row"><span class="status-label">Template size:</span> <span id="statusTemplateSize">--</span></div>
                        <div class="status-row"><span class="status-label">Data size:</span> <span id="statusDataSize">--</span></div>
                        <div class="status-row"><span class="status-label">Data format:</span> <span id="statusDataFormat">--</span></div>
                        <div class="status-row"><span class="status-label">Parse time:</span> <span id="statusParseTime">--</span></div>
                        <div class="status-row"><span class="status-label">Render time:</span> <span id="statusRenderTime">--</span></div>
                        <div class="status-row"><span class="status-label">Output size:</span> <span id="statusOutputSize">--</span></div>
                        <div id="statusWarnings" class="status-warnings" style="display: none;"></div>
                        <div id="statusError" class="status-error-detail" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Output -->
            <div class="right-panel">
                <div class="output-section">
                    <h3>Rendered Output</h3>
                    <div class="input-controls">
                        <button id="downloadOutputBtn" class="secondary-button">Download Output</button>
                    </div>
                    <div id="outputArea" class="output-area empty">
                        <div class="placeholder-text">Rendered output will appear here...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Apstra Modal Overlay -->
    <div id="apstraModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Apstra Device Context Fetcher</h3>
                <button id="closeApstraModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Controller IP & Port -->
                <div class="form-row split">
                    <div class="form-group">
                        <label for="apstraIp">Controller IP</label>
                        <input type="text" id="apstraIp" placeholder="e.g. 192.168.1.100" class="modal-input">
                    </div>
                    <div class="form-group" style="width: 100px; flex-grow: 0;">
                        <label for="apstraPort">Port</label>
                        <input type="text" id="apstraPort" value="443" class="modal-input">
                    </div>
                </div>

                <!-- Credentials -->
                <div class="form-row split">
                    <div class="form-group">
                        <label for="apstraUsername">Username</label>
                        <input type="text" id="apstraUsername" placeholder="admin" class="modal-input">
                    </div>
                    <div class="form-group">
                        <label for="apstraPassword">Password</label>
                        <input type="password" id="apstraPassword" class="modal-input">
                    </div>
                </div>

                <!-- Connection Actions -->
                <button id="connectApstraBtn" class="secondary-button" style="width: 100%; margin-bottom: 15px;">Connect & Load Choices</button>

                <!-- Blueprint ID selection/direct entry -->
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>Blueprint ID</label>
                    <div class="input-choice-row">
                        <select id="apstraBlueprintSelect" class="modal-select" style="display: none;"></select>
                        <input type="text" id="apstraBlueprintDirect" placeholder="Enter Blueprint ID manually" class="modal-input">
                        <button id="toggleBlueprintInput" class="small-toggle-btn" title="Toggle manual input/selection">✏️</button>
                    </div>
                </div>

                <!-- Server ID selection/direct entry -->
                <div class="form-group">
                    <label>Server/System ID</label>
                    <div class="input-choice-row">
                        <select id="apstraServerSelect" class="modal-select" style="display: none;"></select>
                        <input type="text" id="apstraServerDirect" placeholder="Enter Server ID manually" class="modal-input">
                        <button id="toggleServerInput" class="small-toggle-btn" title="Toggle manual input/selection">✏️</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelApstraBtn" class="secondary-button">Cancel</button>
                <button id="submitApstraBtn" class="primary-button">Fetch Context</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=1.1"></script>
</body>
</html>
