[project]
name = "jinja2-tester"
version = "0.1.0"
description = "A web application for testing Jinja2 templates"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Flask==2.3.3",
    "Jinja2==3.1.2",
    "PyYAML==6.0.1",
    "python-dotenv==1.0.0",
    "gunicorn==21.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mdformat>=0.7",
    "mdformat-gfm>=0.3",
]

[project.scripts]
jinja2-tester = "jinja2_tester.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jinja2_tester"]

[tool.ruff]
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
